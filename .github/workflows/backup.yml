# CivicBuddy backup & storage management: code and plan in BackUp/.
name: CivicBuddy backup

on:
  schedule:
    # Sunday 02:00 IST (= Saturday 20:30 UTC): full weekly backup.
    - cron: "30 20 * * 6"
    # Every 6 hours: quick storage check (starts the backup above 90%).
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "weekly = full backup, check = storage check"
        type: choice
        options: [weekly, check]
        default: weekly
      dry_run:
        description: "Dry run (change nothing)"
        type: boolean
        default: false

# Never two runs at the same time (a check could overlap the weekly run).
concurrency:
  group: civicbuddy-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: BackUp
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install --quiet -r requirements.txt
          curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null
          rclone version | head -1

      - name: Google Drive login (rclone config from secret)
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then
            echo "::error::Missing secret RCLONE_CONF (contents of ~/.config/rclone/rclone.conf)."
            exit 1
          fi
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BACKUP_SUPABASE_SERVICE_ROLE_KEY }}
          RCLONE_REMOTE: unidrive
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          # Freeing space above 90%: off until the backup is proven.
          # Turn on with repository variable FREE_SPACE = 1.
          FREE_SPACE: ${{ vars.FREE_SPACE || '0' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "30 20 * * 6" ]; then
            mode=weekly
          else
            mode=check
          fi
          echo "Mode: $mode · free space: ${FREE_SPACE} · dry run: ${DRY_RUN}"
          python backup.py "$mode"
