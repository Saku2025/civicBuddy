name: Flutter

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # pubspec.yaml bundles .env as an asset, and the real file is gitignored.
      - name: Create placeholder .env
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test

  # Publishes a GitHub release (which the in-app updater picks up) whenever
  # main has a pubspec.yaml version that has not been released yet.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version from pubspec.yaml
        id: version
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          IFS=. read -r major minor patch <<< "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Android versionCode derived from the version name, so it always
          # increases when the version does: 1.7.2 -> 10702.
          echo "build_number=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released. Bump the version in pubspec.yaml to publish an update."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.version.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        if: steps.version.outputs.exists == 'false'
        with:
          channel: stable
          cache: true

      - name: Write .env and signing key from secrets
        if: steps.version.outputs.exists == 'false'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name (Settings > Secrets and variables > Actions)."
              exit 1
            fi
          done
          printf 'SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > .env
          # Tolerate spaces/line breaks picked up when pasting the secret.
          keystore=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')
          if ! printf '%s' "$keystore" | base64 --decode > "$RUNNER_TEMP/release.jks" 2> /dev/null; then
            echo "::error::KEYSTORE_BASE64 is not valid base64 (${#keystore} characters; the keystore gives 3492). Re-create it with: base64 -i ~/civicbuddy-release.jks | pbcopy"
            exit 1
          fi
          # Trim stray spaces/line breaks from pasted values.
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g'; }
          store_password=$(trim "$KEYSTORE_PASSWORD")
          key_password=$(trim "$KEY_PASSWORD")
          key_alias=$(trim "$KEY_ALIAS")
          # Fail fast, before the long Gradle build, if the alias or
          # passwords do not unlock the key.
          # SHA-256 of ~/civicbuddy-release.jks (the key v1.6.2+ are signed with).
          expected_sha=7a9c52282adf918ea52752f49d0397c05c2c3b53f2e225b6873d0abdcbb661bd
          actual_sha=$(sha256sum "$RUNNER_TEMP/release.jks" | cut -d' ' -f1)
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "::error::KEYSTORE_BASE64 decodes to a different file ($(stat -c %s "$RUNNER_TEMP/release.jks") bytes, expected 2618). Re-create it with: base64 -i ~/civicbuddy-release.jks | pbcopy"
            exit 1
          fi
          if ! keytool_output=$(keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$store_password" 2>&1); then
            echo "::error::KEYSTORE_PASSWORD does not open the keystore (password is ${#store_password} characters; keytool: $keytool_output)"
            exit 1
          fi
          if ! keytool -certreq -keystore "$RUNNER_TEMP/release.jks" -storepass "$store_password" \
              -alias "$key_alias" -keypass "$key_password" > /dev/null 2>&1; then
            echo "::error::KEY_ALIAS or KEY_PASSWORD is wrong. Aliases in the keystore: $(keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$store_password" 2>/dev/null | grep PrivateKeyEntry | cut -d, -f1)"
            exit 1
          fi
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$store_password" "$key_password" "$key_alias" "$RUNNER_TEMP/release.jks" > android/key.properties

      - name: Build APK
        if: steps.version.outputs.exists == 'false'
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --build-number=${{ steps.version.outputs.build_number }}
          cp build/app/outputs/flutter-apk/app-release.apk "garbage_detection_v${{ steps.version.outputs.version }}.apk"

      # Installed apps only accept updates signed with the same key.
      - name: Verify signing key
        if: steps.version.outputs.exists == 'false'
        run: |
          expected=73e86ffbf3fde0ba61c5b3efebdbe73c401323bf440e45e0c1808555896df344
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          actual=$("$apksigner" verify --print-certs "garbage_detection_v${{ steps.version.outputs.version }}.apk" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          if [ "$actual" != "$expected" ]; then
            echo "::error::APK is signed with the wrong key ($actual). Installed apps would refuse this update."
            exit 1
          fi

      - name: Publish GitHub release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "## Changes"
            git log --no-merges --pretty='- %s' ${previous:+$previous..}HEAD | head -n 30
          } > release_notes.md
          gh release create "v$VERSION" "garbage_detection_v$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "CivicBuddy v$VERSION" \
            --notes-file release_notes.md \
            --latest
