name: my_app

description: "CivicBuddy - field surveys of garbage hotspots with GPS, photos and questionnaires."

publish_to: 'none'

version: 1.7.0+6

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  camera: ^0.12.0+2
  geolocator: ^14.0.3
  geocoding: ^4.0.0

  shared_preferences: ^2.5.5

  supabase_flutter: ^2.17.2

  flutter_native_splash: ^2.4.8
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon_android.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icon/app_icon.png
    - assets/icon/app_icon_ios.png
    - assets/icon/app_icon_android.png

flutter_native_splash:
  color: "#F5F8F5"
  color_dark: "#0F1712"

  image: assets/icon/app_icon_android.png

  android: true
  ios: true

  ios_content_mode: center

  android_12:
    color: "#F5F8F5"
    color_dark: "#0F1712"
    image: assets/icon/app_icon_android.png