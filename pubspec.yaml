name: my_app

description: "A new Flutter project."

publish_to: 'none'

version: 1.6.1+3

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  camera: ^0.12.0+2
  geolocator: ^14.0.3
  geocoding: ^4.0.0

  shared_preferences: ^2.5.5

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  path_provider: ^2.1.6
  uuid: ^4.6.0

  supabase_flutter: ^2.17.2

  http: ^1.5.0
  package_info_plus: ^10.2.1
  open_filex: ^4.7.0

  flutter_native_splash: ^2.4.8
  flutter_dotenv: ^6.0.1
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon_android.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icon/app_icon.png
    - assets/icon/app_icon_ios.png
    - assets/icon/app_icon_android.png

flutter_native_splash:
  color: "#F5F8F5"
  color_dark: "#0F1712"

  image: assets/icon/app_icon_ios.png

  android: true
  ios: true

  ios_content_mode: center

  android_12:
    color: "#F5F8F5"
    color_dark: "#0F1712"
    image: assets/icon/app_icon_android.png